<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Construcción</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        /* Contenedor de engranajes animados */
        .gears {
            position: relative;
            width: 120px;
            height: 100px;
            margin: 0 auto 25px;
        }

        .gear-big {
            position: absolute;
            top: 5px;
            left: 15px;
            width: 65px;
            height: 65px;
            fill: #3b82f6;
            animation: spin 6s linear infinite;
        }

        .gear-small {
            position: absolute;
            bottom: 5px;
            right: 15px;
            width: 45px;
            height: 45px;
            fill: #38bdf8;
            animation: spinReverse 4s linear infinite;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #60a5fa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Barra de progreso animada */
        .progress-wrapper {
            background: #1e293b;
            border-radius: 999px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            width: 65%;
            border-radius: 999px;
            background: linear-gradient(90deg, #2563eb, #38bdf8, #2563eb);
            background-size: 200% 100%;
            animation: progressShimmer 2s linear infinite, loadPulse 3s ease-in-out infinite alternate;
        }

        .status-text {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Puntos suspensivos animados */
        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            100% { transform: rotate(-360deg); }
        }

        @keyframes progressShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes loadPulse {
            0% { width: 55%; }
            100% { width: 78%; }
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

        </div>

        <h1>Página en Construcción</h1>
        <p>Estamos preparando algo genial. Muy pronto estaremos en línea con todo el contenido listo para ti.</p>

        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>
        <div class="status-text">Desarrollando sitio<span class="dots"></span></div>
    </div>

</body>
</html>
